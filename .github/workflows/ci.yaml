name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No CI job can boot a VM; the VM tests fail by default and this is the explicit opt-out.
  DEVVM_SKIP_VM_TESTS: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The cargo-fmt hook (language = "system") needs a toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint

      # prek.toml is the single source of truth for lint; the same checks run locally as git hooks. Clippy runs per
      # platform in the Test job instead.
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: cargo-clippy
        with:
          prek-version: 0.5.3

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # windows-latest's ANSI code page is 1252; the claim test fails if the image changes it.
      - name: Test
        run: cargo test --workspace --locked
        env:
          DEVVM_COVERS_ACP: ${{ runner.os == 'Windows' && '1252' || '' }}

      # The copy tests again, against OpenSSH's own sftp-server instead of the scripted one. The claim makes them fail,
      # not skip, if the run does not use it.
      - name: Install OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-sftp-server

      - name: Test the copy against OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: cargo test -p devvm --lib --locked
        env:
          DEVVM_COVERS_OPENSSH_SFTP: "1"

      # The packaged crate must carry every file the library includes (the embedded recipes).
      - name: Package
        if: runner.os == 'Linux'
        run: cargo package -p devvm --locked

  # The workspace must build on the oldest toolchain it declares (`rust-version`), with the locked dependencies.
  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the declared Rust version
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked
