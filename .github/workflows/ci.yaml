name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Test groups (crates/devvm/src/test_groups.rs) are on unless set to 0. The groups a job cannot run are off here, and
  # each step that runs one opts back in.
  DEVVM_TEST_VM: "0"
  DEVVM_TEST_PYYAML: "0"
  DEVVM_TEST_OPENSSH_SFTP: "0"
  DEVVM_TEST_NTFS_NAMES: "0"
  DEVVM_TEST_ACP_1252: "0"
  DEVVM_TEST_EXFAT_VOLUME: "0"
  # 1 puts the VM tests' directories in C:\Users, which only the Windows runner can make; 0 uses the temp dir.
  DEVVM_TEST_UNICODE_BASE: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The cargo-fmt hook (language = "system") needs a toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint

      # prek.toml is the single source of truth for lint; the same checks run locally as git hooks. Clippy runs per
      # platform in the Test job instead.
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: cargo-clippy
        with:
          prek-version: 0.5.10

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The seed test reads the cloud-init seed with PyYAML through `uv run --script` (Linux only; see Test below).
      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
        env:
          DEVVM_TEST_PYYAML: ${{ runner.os == 'Linux' && '1' || '0' }}
          DEVVM_TEST_NTFS_NAMES: ${{ runner.os == 'Windows' && '1' || '0' }}
          DEVVM_TEST_ACP_1252: ${{ runner.os == 'Windows' && '1' || '0' }}
          # The test attaches an exFAT virtual disk; a hosted runner is a throwaway sandbox.
          DEVVM_TEST_EXFAT_VOLUME: ${{ runner.os == 'Windows' && '1' || '0' }}
          DEVVM_TEST_EXFAT_VOLUME_CONSENT: "1"
          # The test of the four XDG variables under the user's unicode root.
          DEVVM_TEST_UNICODE_BASE: ${{ runner.os == 'Windows' && '1' || '0' }}

      # The copy tests again, against OpenSSH's own sftp-server instead of the scripted one.
      - name: Install OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-sftp-server

      - name: Test the copy against OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: cargo test -p devvm --lib --locked
        env:
          # Only the SFTP tests (the `sftp` label), not the whole suite again.
          SKULD_LABELS: sftp
          DEVVM_TEST_OPENSSH_SFTP: "1"
          DEVVM_TEST_SFTP_SERVER: openssh

      # The packaged crate must carry every file the library includes (the embedded recipes).
      - name: Package
        if: runner.os == 'Linux'
        run: cargo package -p devvm --locked

  # The tests that boot QEMU, under the Windows Hypervisor Platform of a hosted runner. Every test labelled `vm` runs
  # here; the Test job leaves them out (DEVVM_TEST_VM=0). The tests fetch the pinned QEMU through devvm's own
  # downloader, as a user's install does.
  vm:
    name: VM tests (windows-latest, WHPX)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVVM_TEST_UNICODE_BASE: "1"
      # The VM group's tests and the 1252 group's.
      SKULD_LABELS: vm | acp_1252
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: vm

      - name: Test
        run: cargo test -p devvm --lib --locked
        env:
          # A hosted runner is a throwaway sandbox, with WHPX.
          DEVVM_TEST_VM: "1"
          DEVVM_TEST_VM_CONSENT: "1"
          DEVVM_TEST_ACP_1252: "1"

  # The workspace must build on the oldest toolchain it declares (`rust-version`), with the locked dependencies.
  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the declared Rust version
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked
