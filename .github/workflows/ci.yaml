name: CI

on:
  push:
    branches: [main, bindreams/dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Test groups (crates/devvm/src/test_groups.rs) are on unless set to 0. The groups a job cannot run are off here, and
  # each step that runs one opts back in.
  DEVVM_TEST_VM: "0"
  DEVVM_TEST_PYYAML: "0"
  DEVVM_TEST_OPENSSH_SFTP: "0"
  DEVVM_TEST_NTFS_NAMES: "0"
  DEVVM_TEST_ACP_1252: "0"
  DEVVM_TEST_EXFAT_VOLUME: "0"
  # The Windows guest's tests build a base from an ISO and boot it; only the vm-windows job runs them. The vm job
  # selects `vm`, a label they carry, so it needs this off.
  DEVVM_TEST_WINDOWS_GUEST: "0"
  # 1 puts the VM tests' directories in C:\Users, which only the Windows runner can make; 0 uses the temp dir.
  DEVVM_TEST_UNICODE_BASE: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The cargo-fmt hook (language = "system") needs a toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint

      # prek.toml is the single source of truth for lint; the same checks run locally as git hooks. Clippy runs per
      # platform in the Test job instead.
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: cargo-clippy
        with:
          prek-version: 0.5.10

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The seed test reads the cloud-init seed with PyYAML through `uv run --script` (Linux only; see Test below).
      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
        env:
          DEVVM_TEST_PYYAML: ${{ runner.os == 'Linux' && '1' || '0' }}
          DEVVM_TEST_NTFS_NAMES: ${{ runner.os == 'Windows' && '1' || '0' }}
          DEVVM_TEST_ACP_1252: ${{ runner.os == 'Windows' && '1' || '0' }}
          # The test attaches an exFAT virtual disk; a hosted runner is a throwaway sandbox.
          DEVVM_TEST_EXFAT_VOLUME: ${{ runner.os == 'Windows' && '1' || '0' }}
          DEVVM_TEST_EXFAT_VOLUME_CONSENT: "1"
          # The test of the four XDG variables under the user's unicode root.
          DEVVM_TEST_UNICODE_BASE: ${{ runner.os == 'Windows' && '1' || '0' }}

      # The copy tests again, against OpenSSH's own sftp-server instead of the scripted one.
      - name: Install OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-sftp-server

      - name: Test the copy against OpenSSH's SFTP server
        if: runner.os == 'Linux'
        run: cargo test -p devvm --lib --locked
        env:
          # Only the SFTP tests (the `sftp` label), not the whole suite again.
          SKULD_LABELS: sftp
          DEVVM_TEST_OPENSSH_SFTP: "1"
          DEVVM_TEST_SFTP_SERVER: openssh

      # The packaged crate must carry every file the library includes (the embedded recipes).
      - name: Package
        if: runner.os == 'Linux'
        run: cargo package -p devvm --locked

  # The tests that boot QEMU, under the Windows Hypervisor Platform of a hosted runner. Every test labelled `vm` runs
  # here; the Test job leaves them out (DEVVM_TEST_VM=0). The tests fetch the pinned QEMU through devvm's own
  # downloader, as a user's install does.
  vm:
    name: VM tests (windows-latest, WHPX)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVVM_TEST_UNICODE_BASE: "1"
      # The VM group's tests and the 1252 group's.
      SKULD_LABELS: vm | acp_1252
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: vm

      - name: Test
        run: cargo test -p devvm --lib --locked
        env:
          # A hosted runner is a throwaway sandbox, with WHPX.
          DEVVM_TEST_VM: "1"
          DEVVM_TEST_VM_CONSENT: "1"
          DEVVM_TEST_ACP_1252: "1"

      # The same group through the real `devvm` executable; its tests carry the `vm` label only.
      - name: Test the devvm executable
        run: cargo test -p devvm-cli --locked --test vm_cli
        env:
          SKULD_LABELS: vm
          DEVVM_TEST_VM: "1"
          DEVVM_TEST_VM_CONSENT: "1"

  # Whether this run has to build a Windows guest: always, except for a pull request that touches nothing a Windows guest
  # is made of. (qemu.yaml filters its whole workflow by `paths`; here one job of several is filtered, so the changed
  # files are read.)
  windows-changes:
    name: Windows guest files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare with the base of the pull request
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(crates/|qemu/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yaml$)'
          if git diff --name-only "$BASE" HEAD | grep -E "$pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # A Windows guest built from Microsoft's Windows 11 Enterprise evaluation ISO, which it follows from the download link
  # (no pinned build: Microsoft retires them, and layers are keyed by the ISO's content), under the hypervisor platform of
  # a hosted runner. The tests that need it carry the `windows_guest` label. The runner's C: has about 21 GB free after
  # the ISO, so the ISO, the temporary directory and with it every root the tests make are on D:.
  vm-windows:
    name: Windows guest tests (windows-latest, WHPX)
    needs: windows-changes
    if: needs.windows-changes.outputs.changed == 'true'
    runs-on: windows-latest
    # Two Windows bases are built (the library's tests and the executable's each keep their own stores): Windows Setup took
    # 22 to 40 minutes and the first logon 4 on a hosted runner, with about 12 minutes of downloads before each. The suites
    # boot about twenty instances of their own, one at a time, besides the shared one. The first full run sets this again;
    # a hosted job ends at 360.
    timeout-minutes: 345
    env:
      SKULD_LABELS: windows_guest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: vm-windows

      # The tests' roots are below the temporary directory (DEVVM_TEST_UNICODE_BASE stays 0), so TMP and TEMP move to D:.
      - name: Move the temporary directory to the D drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\devvm-tmp | Out-Null
          "TMP=D:\devvm-tmp" >> $env:GITHUB_ENV
          "TEMP=D:\devvm-tmp" >> $env:GITHUB_ENV

      # The link ignores the language in its query and always answers en-US.
      - name: Download the Windows 11 evaluation ISO
        shell: pwsh
        run: |
          $link = 'https://go.microsoft.com/fwlink/?linkid=2334167&clcid=0x409&culture=en-us&country=us'
          $final = curl.exe --silent --show-error --fail --location --output D:\windows.iso --write-out '%{url_effective}' $link
          if ($LASTEXITCODE -ne 0) { throw "cannot download $link" }
          $hash = (Get-FileHash -Algorithm SHA256 D:\windows.iso).Hash.ToLowerInvariant()
          $size = (Get-Item D:\windows.iso).Length
          "ISO: $final ($size bytes, sha256 $hash)"
          "- ISO: $final, $size bytes, sha256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Test
        # A step that hangs ends at its own limit, so the next step and the serial-log upload still run. The limits sum to
        # less than the job's: this one covers a Windows base build and about twenty boots, the next one a base build and
        # the exec table.
        timeout-minutes: 170
        # --nocapture: the base build's progress lines (the guest's markers and license read) land in the log on a pass too.
        run: cargo test -p devvm --lib --locked -- --nocapture
        env:
          # A hosted runner is a throwaway sandbox, with WHPX.
          DEVVM_TEST_VM: "1"
          DEVVM_TEST_VM_CONSENT: "1"
          DEVVM_TEST_WINDOWS_GUEST: "1"
          DEVVM_WINDOWS_ISO: D:\windows.iso

      # The same group through the real `devvm` executable: the exec table through `devvm ssh`. It builds a base of its own.
      - name: Test the devvm executable
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: cargo test -p devvm-cli --locked --test vm_cli -- --nocapture
        env:
          DEVVM_TEST_VM: "1"
          DEVVM_TEST_VM_CONSENT: "1"
          DEVVM_TEST_WINDOWS_GUEST: "1"
          DEVVM_WINDOWS_ISO: D:\windows.iso

      - name: Free space
        if: always()
        shell: pwsh
        run: Get-PSDrive C, D | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free / 1GB, 1)}}, @{n='UsedGB';e={[math]::Round($_.Used / 1GB, 1)}}

      # A run that was cut short leaves its build directories, with the serial logs.
      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-serial-logs
          path: |
            D:\devvm-tmp\**\serial-*.log
            D:\devvm-tmp\**\qemu.log
          if-no-files-found: ignore

  # The workspace must build on the oldest toolchain it declares (`rust-version`), with the locked dependencies.
  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the declared Rust version
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked
