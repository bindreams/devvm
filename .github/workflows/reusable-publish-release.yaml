name: Reusable Publish Release

# Step 2 of a track's two-step release: makes a verified draft public. The caller runs reusable-verify-release.yaml
# first and passes its outputs here, and passes this job `contents: write`.
#
# "Latest" is set explicitly so an edit to the draft cannot change it, and checked repository-wide after every publish.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag and release name"
        required: true
        type: string
      commit:
        description: "The commit the verified assets were built from"
        required: true
        type: string
      release-id:
        description: "The id of the verified release"
        required: true
        type: string
      assets:
        description: "The verified assets, as `<asset id> sha256:<hex> <name>` lines"
        required: true
        type: string
      latest:
        description: "Whether this track's releases are the repository's Latest"
        required: true
        type: boolean
      non-latest-tag-patterns:
        description: >-
          Shell globs, one per line, matching the tags of every `latest: false` track in the repository (qemu:
          `qemu-*`). A release matching none of them counts as a `latest: true` track's.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish the verified release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One group for every publish in the repository, whatever its tag or track, so one publish's PATCH and checks
    # never interleave with another's.
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ inputs.commit }}
      RELEASE_ID: ${{ inputs.release-id }}
      ASSETS: ${{ inputs.assets }}
      LATEST: ${{ inputs.latest }}
      NON_LATEST_PATTERNS: ${{ inputs.non-latest-tag-patterns }}
    steps:
      - name: Publish
        run: |
          set -euo pipefail
          # The tag must still be where it was verified, and the release must be the one that was verified.
          tagged="$(gh api -X GET "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.sha)"
          if [[ "$tagged" != "$COMMIT" ]]; then
            echo "::error::the tag ${TAG} is at ${tagged}, not the verified commit ${COMMIT}"
            exit 1
          fi
          state="$(gh api -X GET "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '"\(.tag_name) \(.draft)"')"
          read -r release_tag draft <<< "$state"
          if [[ "$release_tag" != "$TAG" ]]; then
            echo "::error::release ${RELEASE_ID} is ${release_tag}, not ${TAG}"
            exit 1
          fi
          if [[ "$draft" != "true" ]]; then
            # Already public: the PATCH re-applies "Latest", and the checks below run again.
            echo "the release ${TAG} was already published"
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false -f make_latest="$LATEST"

          # A draft stays editable until the PATCH: the assets must still be the verified ones.
          expected="$(LC_ALL=C sort <<< "$ASSETS")"
          actual="$(gh api -X GET --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" -f per_page=100 \
            --jq '.[] | "\(.id) \(.digest) \(.name)"' | LC_ALL=C sort)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "::error::the assets of ${TAG} are not the verified ones"
            printf 'verified:\n%s\npublished:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          # The repository-wide invariant, checked on every publish whatever tag holds the badge: Latest belongs to a
          # `latest: true` track's release, or to a never-Latest track's while no published full release of a
          # `latest: true` track exists (GitHub then picks the newest full release whatever make_latest says). One
          # GraphQL read gives the holder and the count together; `/releases/latest` is eventually consistent. A stale
          # read is caught by the next publish.
          releases="$(gh api graphql --paginate -f owner="${GH_REPO%%/*}" -f name="${GH_REPO#*/}"             -f query='query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                releases(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { tagName isDraft isPrerelease isLatest }
                }
              }
            }' --jq '.data.repository.releases.nodes[] | "\(.tagName) \(.isDraft) \(.isPrerelease) \(.isLatest)"')"
          # Exit status 0 if the tag is on a never-Latest track, printing the pattern.
          matching_non_latest_pattern() {
            local tag="$1" pattern
            while IFS= read -r pattern; do
              if [[ -n "$pattern" && "$tag" == $pattern ]]; then
                echo "$pattern"
                return 0
              fi
            done <<< "$NON_LATEST_PATTERNS"
            return 1
          }

          # `latest` and the patterns must agree about this tag's own track.
          if pattern="$(matching_non_latest_pattern "$TAG")"; then
            if [[ "$LATEST" == "true" ]]; then
              echo "::error::${TAG} is published with latest: true, but it matches the never-Latest pattern ${pattern}"
              exit 1
            fi
          elif [[ "$LATEST" != "true" ]]; then
            echo "::error::${TAG} is published with latest: false, but it matches no never-Latest pattern"
            exit 1
          fi

          latest_taking=0
          this_published=false
          holders=()
          while IFS=' ' read -r name is_draft is_prerelease is_latest; do
            if [[ "$is_draft" == "false" ]]; then
              if [[ "$name" == "$TAG" ]]; then
                this_published=true
              fi
              if [[ "$is_prerelease" == "false" ]] && ! matching_non_latest_pattern "$name" > /dev/null; then
                latest_taking=$((latest_taking + 1))
              fi
            fi
            if [[ "$is_latest" == "true" ]]; then
              holders+=("$name")
            fi
          done <<< "$releases"
          if [[ "$this_published" != "true" ]]; then
            echo "::error::${TAG} is not a published release in the repository's release list"
            exit 1
          fi
          if (( ${#holders[@]} > 1 )); then
            echo "::error::more than one release is Latest: ${holders[*]}"
            exit 1
          fi

          holder="${holders[0]:-}"
          if [[ "$LATEST" == "true" && "$holder" != "$TAG" ]]; then
            echo "::error::${TAG} must be the repository's Latest release, but it is '${holder}'"
            exit 1
          fi
          if [[ -n "$holder" ]] && pattern="$(matching_non_latest_pattern "$holder")"; then
            if (( latest_taking == 0 )); then
              echo "::notice::${holder} is Latest because no release of a Latest-taking track is published"
            else
              echo "::error::${holder} is the repository's Latest release, but its track never takes Latest (${pattern}) and ${latest_taking} full release(s) of a Latest-taking track are published"
              exit 1
            fi
          fi
          echo "Release published: https://github.com/${GH_REPO}/releases/tag/${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
