name: Spike Windows guests

# U5 Task S (never merged; attended code, no tests of its own). Measures what a Windows guest needs, in CI only: no VM
# boots on a developer's PC. Runs on every push to this branch; `spike/PLAN` says which legs and stages.
#
#   plan      reads spike/PLAN; records the pins of the small downloads.
#   seedtool  builds devvm's write_cidata_image as a command (the answer disk and the stage disks).
#   broker    builds ssh-broker at BROKER_COMMIT (no release exists).
#   install   per language leg: download the evaluation ISO, patch its boot image, install unattended under QEMU/WHPX
#             (M1, M2, M9, M11, M14, M15), upload the installed disk, then boot it once with a stage disk (`boot1`).
#             `reuse=<run id>` in PLAN skips the install and takes that run's disk.
#   m12b      qemu-img overlay of the ISO and a boot from it.

on:
  push:
    branches: [U5-spike-windows]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  # D: has about 220 GB free on the hosted runner; C: has about 20 GB after the downloads.
  WORK: D:/spike
  BROKER_COMMIT: fb612cf3d05fb4dd1546fcb8750727684e528802
  OPENSSH_URL: https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-Win64.zip
  PWSH_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.7.0/PowerShell-7.7.0-win-x64.zip
  VIRTIO_URL: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win-0.1.302.iso
  ISO_URL_EN_US: https://go.microsoft.com/fwlink/?linkid=2334167&clcid=0x409&culture=en-us&country=us
  ISO_URL_DE_DE: https://aka.ms/Win11E-ISO-25H2-de-de
  # Windows 11 IoT Enterprise LTSC 2024 evaluation, x64, en-US, build 26100.1742 (5,060,020,224 bytes). Its pin is
  # `ltsc_sha256=` in spike/PLAN (Microsoft's Windows11IoTEnterpriseLTSC2024EvalHashValues.pdf, fwlink 2272287, says
  # 8ABF91C9...); the 25H2 legs follow their fwlinks and pin nothing.
  ISO_URL_LTSC: https://go.microsoft.com/fwlink/?linkid=2270353
  HASH_PDF_URL: https://go.microsoft.com/fwlink/?linkid=2272287
  HASH_PDF_SHA256: 629639dca3909505ae0c2335a992daa65821acaf4667286c41e491fe8f076dae

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      reuse: ${{ steps.plan.outputs.reuse }}
      stage: ${{ steps.plan.outputs.stage }}
      m12b: ${{ steps.plan.outputs.m12b }}
      cpu: ${{ steps.plan.outputs.cpu }}
      stacks_from: ${{ steps.plan.outputs.stacks_from }}
      ltsc_hash: ${{ steps.plan.outputs.ltsc_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read spike/PLAN
        id: plan
        run: |
          set -euxo pipefail
          get() { sed -n "s/^$1=\(.*\)$/\1/p" spike/PLAN | head -n 1; }
          {
            echo "legs=$(jq -cn --arg legs "$(get legs)" '$legs | split(",") | map(select(length > 0))')"
            echo "reuse=$(get reuse)"
            echo "stage=$(get stage)"
            echo "m12b=$(get m12b)"
            echo "cpu=$(get cpu)"
            echo "stacks_from=$(get stacks_from)"
            echo "ltsc_hash=$(get ltsc_hash)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Record the pins of the small downloads
        run: |
          set -euxo pipefail
          mkdir -p pins
          for url in "$OPENSSH_URL" "$PWSH_URL"; do
            curl -X GET -fsSL -o pins/asset.zip "$url"
            printf '%s\n  url: %s\n  bytes: %s\n  sha256: %s\n' "${url##*/}" "$url" "$(stat -c %s pins/asset.zip)" "$(sha256sum pins/asset.zip | cut -d' ' -f1)" | tee -a pins/pins.txt
          done
          rm pins/asset.zip
          printf 'ssh-broker commit: %s\n' "$BROKER_COMMIT" | tee -a pins/pins.txt

      # M14: does the evaluation center offer a Windows 11 LTSC 2024 evaluation ISO? The pages and the download links
      # they carry, with a HEAD request per link (no download). A page that refuses the runner is the answer too.
      - name: M14, the LTSC 2024 evaluation ISO
        run: |
          set -uo pipefail
          mkdir -p pins/m14
          agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for page in download-windows-11-iot-enterprise-ltsc-eval evaluate-windows-11-iot-enterprise-ltsc; do
            curl -X GET -sSL -A "$agent" -o "pins/m14/$page.html" -w "$page: %{http_code} %{url_effective} %{size_download} bytes\n" \
              "https://www.microsoft.com/en-us/evalcenter/$page" | tee -a pins/m14/pages.txt
            grep -o 'https\?://go.microsoft.com/fwlink/?linkid=[0-9]*[^"<& ]*' "pins/m14/$page.html" | sort -u | tee -a pins/m14/links.txt || true
          done
          sort -u pins/m14/links.txt | while IFS= read -r link; do
            echo "== $link" | tee -a pins/m14/heads.txt
            curl -I -sSL -A "$agent" "$link" | grep -i -e '^HTTP' -e '^location' -e '^content-length' -e '^content-type' | tee -a pins/m14/heads.txt || true
          done
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pins
          path: pins/

  # M14: which SHA256 is right for the LTSC 2024 evaluation ISO? The first download (run 43329256748) gave 2cee70bd...,
  # Microsoft's PDF says 8ABF91C9.... This job downloads the ISO again from the same fwlink on an ubuntu runner (no VM, no
  # install) and records every hop's headers, the size and three digests, and Content-MD5 against the file's md5 when the
  # server sends one. It also fetches the hash PDF again and searches its text for both values. It decides nothing and
  # pins nothing. `ltsc_hash=1` in spike/PLAN turns it on.
  ltsc-hash:
    needs: [plan]
    if: needs.plan.outputs.ltsc_hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download the LTSC ISO a second time
        run: |
          set +e -uo pipefail
          mkdir -p out
          {
            date -u +'started %Y-%m-%dT%H:%M:%SZ'
            curl --version | head -n 1
            echo "runner: $(uname -a)"
          } | tee out/context.txt
          # -D writes the headers of every hop (the fwlink redirects, then the file server answers).
          curl -X GET -fsSL -D out/iso-headers.txt -o "$RUNNER_TEMP/win.iso" \
            -w 'final url: %{url_effective}\nhttp code: %{http_code}\nbytes: %{size_download}\nremote ip: %{remote_ip}\n' \
            "$ISO_URL_LTSC" | tee out/iso-download.txt
          echo "curl exit: ${PIPESTATUS[0]}" | tee -a out/iso-download.txt
          ls -l "$RUNNER_TEMP/win.iso" | tee -a out/iso-download.txt
          sha256sum "$RUNNER_TEMP/win.iso" | tee out/iso-digests.txt
          sha1sum "$RUNNER_TEMP/win.iso" | tee -a out/iso-digests.txt
          md5sum "$RUNNER_TEMP/win.iso" | tee -a out/iso-digests.txt
          echo '== headers (CRs removed)'
          tr -d '\r' < out/iso-headers.txt | tee out/iso-headers.clean.txt
          echo '== the headers that name the file'
          grep -i -e '^http/' -e '^location:' -e '^content-length:' -e '^content-type:' -e '^last-modified:' -e '^etag:' \
            -e 'md5' -e 'x-ms-' -e '^content-disposition:' -e '^age:' -e '^x-cache' out/iso-headers.clean.txt | tee out/iso-headers.key.txt
          # Content-MD5 (and x-ms-blob-content-md5) are base64 of the raw digest.
          got=$(md5sum "$RUNNER_TEMP/win.iso" | cut -d' ' -f1)
          grep -i -e '^content-md5:' -e '^x-ms-blob-content-md5:' out/iso-headers.clean.txt | while IFS=: read -r name value; do
              value=$(echo "$value" | tr -d ' ')
              hex=$(echo -n "$value" | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n')
              if [[ "$hex" == "$got" ]]; then verdict=matches; else verdict=DIFFERS; fi
              echo "$name: $value = $hex; the file's md5 is $got: $verdict"
          done | tee out/content-md5.txt
          [[ -s out/content-md5.txt ]] || echo 'the server sent no Content-MD5' | tee out/content-md5.txt
          rm -f "$RUNNER_TEMP/win.iso"

      - name: Fetch the hash PDF again
        continue-on-error: true
        run: |
          set +e -uo pipefail
          curl -X GET -fsSL -D out/pdf-headers.txt -o out/hashes.pdf \
            -w 'final url: %{url_effective}\nbytes: %{size_download}\n' "$HASH_PDF_URL" | tee out/pdf-download.txt
          got=$(sha256sum out/hashes.pdf | cut -d' ' -f1)
          echo "pdf sha256: $got (the copy read on 2026-11-13: $HASH_PDF_SHA256)" | tee -a out/pdf-download.txt
          if [[ "$got" == "$HASH_PDF_SHA256" ]]; then echo 'the PDF is unchanged' | tee -a out/pdf-download.txt; else echo 'the PDF DIFFERS from the copy read on 2026-11-13' | tee -a out/pdf-download.txt; fi
          tr -d '\r' < out/pdf-headers.txt | grep -i -e '^http/' -e '^last-modified:' -e '^etag:' | tee -a out/pdf-download.txt
          sudo apt-get install -y -qq poppler-utils > /dev/null 2>&1 || true
          pdftotext -layout out/hashes.pdf out/hashes.txt
          grep -i -c '8ABF91C9CD408368DC73AAB3425D5E3C02DAE74900742072EB5C750FC637C195' out/hashes.txt | sed 's/^/lines with 8ABF91C9 (the published value): /' | tee -a out/pdf-download.txt
          grep -i -c '2CEE70BD183DF42B92A2E0DA08CC2BB7A2A9CE3A3841955A012C0F77AEB3CB29' out/hashes.txt | sed 's/^/lines with 2CEE70BD (the value of the first download): /' | tee -a out/pdf-download.txt
          grep -i 'sha256' -A 1 out/hashes.txt | tee out/hashes.key.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ltsc-hash
          path: out/

  seedtool:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: spike-seedtool

      - name: Build seed_spike
        run: |
          set -euxo pipefail
          cargo build --locked -p devvm --example seed_spike
          mkdir -p tool
          cp target/debug/examples/seed_spike.exe tool/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seedtool
          path: tool/

  broker:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build ssh-broker at the recorded commit
        run: |
          set -euxo pipefail
          git clone https://github.com/bindreams/ssh-broker.git broker-src
          git -C broker-src checkout "$BROKER_COMMIT"
          # main links the CRT statically itself (.cargo/config.toml, ssh-broker#62), so a clean Windows needs no VC++
          # redistributable; no RUSTFLAGS here, which would replace that setting.
          (cd broker-src && cargo build --release)
          mkdir -p broker-out
          find broker-src/target/release -maxdepth 1 -type f -name '*.exe' -exec cp {} broker-out/ \;
          (cd broker-out && sha256sum ./*.exe | tee sha256.txt)
          git -C broker-src log -1 --format='%H %s' | tee broker-out/commit.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker
          path: broker-out/

  install:
    needs: [plan, seedtool, broker]
    # `legs=` empty in spike/PLAN is every install leg off: a matrix with no values would fail the workflow.
    if: needs.plan.outputs.stacks_from == '' && needs.plan.outputs.legs != '[]'
    runs-on: windows-latest
    # The job bound sits above every step bound below, so the log upload always gets to run.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    defaults:
      run:
        shell: bash
    env:
      LEG: ${{ matrix.leg }}
      CPU: ${{ needs.plan.outputs.cpu }}
      OUT: D:/spike/out
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: false

      - name: Read this leg's plan
        run: |
          set -euo pipefail
          get() { sed -n "s/^$1=\(.*\)$/\1/p" spike/PLAN | head -n 1; }
          # `reuse_<leg>=` (even empty) replaces `reuse=` for that leg: a leg with no base yet installs.
          if grep -q "^reuse_$LEG=" spike/PLAN; then
              reuse=$(get "reuse_$LEG")
          else
              reuse=$(get reuse)
          fi
          echo "REUSE_RUN=$reuse" | tee -a "$GITHUB_ENV"
          # `stage_<leg>=` (even empty) replaces `stage=` for that leg, like `reuse_<leg>=`.
          if grep -q "^stage_$LEG=" spike/PLAN; then
              stage=$(get "stage_$LEG")
          else
              stage=$(get stage)
          fi
          echo "STAGE=$stage" | tee -a "$GITHUB_ENV"
          # The LTSC leg's pin is `ltsc_sha256=` in spike/PLAN (SHA256 of the ISO the fwlink serves).
          if [[ "$LEG" == LTSC* ]]; then
              pin=$(get ltsc_sha256)
              if [[ -z "$pin" ]]; then echo 'spike/PLAN has no ltsc_sha256 for the LTSC leg' >&2; exit 1; fi
              echo "ISO_SHA256_LTSC=${pin,,}" | tee -a "$GITHUB_ENV"
          fi

      - name: Record the runner
        run: |
          set -euxo pipefail
          mkdir -p "$WORK" "$OUT"
          {
            echo "leg: $LEG reuse: ${REUSE_RUN:-none} stage: ${STAGE:-none} cpu: $CPU"
            df -h /c /d || true
            systeminfo | grep -i -e 'total physical memory' -e 'hyper-v' -e 'processor(s)' -A 3 || true
            nproc
          } 2>&1 | tee "$OUT/runner.txt"

      - name: Download and verify QEMU
        run: |
          set -euxo pipefail
          url=$(sed -n 's/^url = "\(.*\)"/\1/p' crates/devvm/qemu-manifest.toml)
          want=$(sed -n 's/^sha256 = "\(.*\)"/\1/p' crates/devvm/qemu-manifest.toml)
          asset=${url##*/}
          tag=$(basename "$(dirname "$url")")
          gh release download "$tag" -R bindreams/devvm -p "$asset" -D "$RUNNER_TEMP/qemu-dl"
          got=$(sha256sum "$RUNNER_TEMP/qemu-dl/$asset" | cut -d' ' -f1)
          got=${got#'\'}
          test "$want" = "$got"
          mkdir -p "$WORK/qemu"
          unzip -q "$RUNNER_TEMP/qemu-dl/$asset" -d "$WORK/qemu"
          echo "$tag" | tee "$OUT/qemu-tag.txt"
          find "$WORK/qemu" -name '*.exe' | tee "$OUT/qemu-files.txt"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seedtool
          path: ${{ env.WORK }}/tool

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker
          path: ${{ env.WORK }}/broker

      # The install ==============================================================================================

      - name: Download the evaluation ISO and the virtio-win ISO
        if: env.REUSE_RUN == ''
        timeout-minutes: 45
        run: |
          set -euxo pipefail
          # A leg is `<language>` or `<language>-<variant>` (the variant only names a different disk rule).
          case "${LEG:0:5}" in
            en-US) iso_url=$ISO_URL_EN_US ;;
            de-DE) iso_url=$ISO_URL_DE_DE ;;
            LTSC*) iso_url=$ISO_URL_LTSC ;;
            *) echo "no ISO URL for leg $LEG" >&2; exit 1 ;;
          esac
          mkdir -p "$WORK/iso"
          curl -X GET -fsSL -o "$WORK/iso/win.iso" -w 'final url: %{url_effective}\nbytes: %{size_download}\n' "$iso_url" | tee "$OUT/iso-download.txt"
          sha256sum "$WORK/iso/win.iso" | tee "$OUT/iso-sha256.txt"
          if [[ "$LEG" == LTSC* ]]; then
              got=$(sha256sum "$WORK/iso/win.iso" | cut -d' ' -f1)
              if [[ "$got" != "$ISO_SHA256_LTSC" ]]; then
                  echo "the LTSC ISO has sha256 $got, expected $ISO_SHA256_LTSC" >&2
                  exit 1
              fi
              echo 'the LTSC ISO matches the published hash' | tee -a "$OUT/iso-sha256.txt"
          fi
          curl -X GET -fsSL -o "$WORK/virtio.iso" -w 'final url: %{url_effective}\nbytes: %{size_download}\n' "$VIRTIO_URL" | tee "$OUT/virtio-download.txt"
          sha256sum "$WORK/virtio.iso" | tee "$OUT/virtio-sha256.txt"
          df -h /c /d | tee "$OUT/df-after-downloads.txt"

      - name: Choose the disk rule
        if: env.REUSE_RUN == ''
        run: |
          set -euo pipefail
          get() { sed -n "s/^$1=\(.*\)$/\1/p" spike/PLAN | head -n 1; }
          rule=$(get "disk_$LEG")
          if [[ -z "$rule" ]]; then
              rule=$(get disk)
          fi
          echo "DISK_RULE=$rule" | tee -a "$GITHUB_ENV" "$OUT/disk-rule.txt"

      - name: Read the image list and render the answer file
        if: env.REUSE_RUN == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = ("$env:WORK/iso/win.iso").Replace('/', '\')
          $out = "$env:OUT"
          New-Item -ItemType Directory -Force -Path "$env:WORK/answer" | Out-Null
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          try {
            $letter = ($image | Get-Volume).DriveLetter
            Get-ChildItem "${letter}:\sources" | Select-Object Name, Length | Out-String | Tee-Object -FilePath "$out/iso-sources.txt"
            # The LTSC ISO may hold several images (the owner's holds three): the IoT Enterprise LTSC one, evaluation or not.
            $select = @()
            if ($env:LEG -like 'LTSC*') { $select = @('--edition-id', 'IoTEnterpriseSEval,IoTEnterpriseS') }
            uv run --script spike/render_answer.py "${letter}:\sources\install.wim" spike/guest/Autounattend.xml.in `
              "$env:WORK/answer/Autounattend.xml" "$out/Autounattend.redacted.xml" "$out/image.json" "$out/install-wim.xml" `
              --disk-rule $env:DISK_RULE @select
            if ($LASTEXITCODE -ne 0) { throw "render_answer.py failed with $LASTEXITCODE" }
          } finally {
            Dismount-DiskImage -ImagePath $iso | Out-Null
          }

      - name: Patch the ISO's UEFI boot image to the no-prompt one, in place
        if: env.REUSE_RUN == ''
        run: |
          set -euxo pipefail
          uv run --script spike/patch_iso.py "$WORK/iso/win.iso" "$WORK/iso/win.iso" | tee "$OUT/patch-iso.txt"

      - name: Build the answer disk and the blank disk
        if: env.REUSE_RUN == ''
        run: |
          set -euxo pipefail
          qemu_img=$(find "$WORK/qemu" -name qemu-img.exe | head -n 1)
          if [[ "$DISK_RULE" == available* ]]; then
              echo partition > "$WORK/answer/partition.flag"
              flag="$WORK/answer/partition.flag"
          else
              flag=
          fi
          # pad.bin makes the image big enough for the Setup logs logcopy.cmd copies onto it; winpe.cmd deletes it.
          head -c 50000000 /dev/zero > "$WORK/answer/pad.bin"
          "$WORK/tool/seed_spike.exe" "$WORK/answer.img" \
            "$WORK/answer/Autounattend.xml" spike/guest/winpe.cmd spike/guest/logcopy.cmd "$WORK/answer/pad.bin" spike/guest/bootstrap.ps1 spike/guest/lib.ps1 spike/guest/hook.ps1 "$WORK/broker/ssh-broker.exe" ${flag:+"$flag"} | tee "$OUT/answer-disk.txt"
          "$qemu_img" create -f qcow2 "$WORK/disk.qcow2" 64G
          share=$(dirname "$(find "$WORK/qemu" -name edk2-x86_64-code.fd | head -n 1)")
          cp "$share/edk2-i386-vars.fd" "$WORK/vars.fd"

      - name: Install Windows (M1)
        if: env.REUSE_RUN == ''
        # The failure bound for Setup and the first logon under nested WHPX (the de-DE install took 22 minutes). Raise it
        # only after summary.json shows the run progressing.
        timeout-minutes: 75
        run: |
          set -euxo pipefail
          uv run --script spike/run_qemu.py install \
            --qemu-dir "$WORK/qemu" --out "$OUT/install" --disk "$WORK/disk.qcow2" --vars "$WORK/vars.fd" \
            --install-iso "$WORK/iso/win.iso" --virtio-iso "$WORK/virtio.iso" --usb-disk "$WORK/answer.img" --usb-writable \
            --done DEVVM-BASE-DONE --cpu "$CPU"

      - name: Compress the installed disk
        if: env.REUSE_RUN == ''
        run: |
          set -euxo pipefail
          qemu_img=$(find "$WORK/qemu" -name qemu-img.exe | head -n 1)
          mkdir -p "$WORK/base"
          ls -l "$WORK/disk.qcow2" | tee "$OUT/disk-size.txt"
          "$qemu_img" info "$WORK/disk.qcow2" | tee -a "$OUT/disk-size.txt"
          "$qemu_img" convert -c -O qcow2 "$WORK/disk.qcow2" "$WORK/base/base.qcow2"
          cp "$WORK/vars.fd" "$WORK/base/vars.fd"
          ls -l "$WORK/base" | tee -a "$OUT/disk-size.txt"
          df -h /c /d | tee -a "$OUT/disk-size.txt"

      - name: Upload the installed disk
        if: env.REUSE_RUN == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-${{ matrix.leg }}
          path: ${{ env.WORK }}/base/
          compression-level: 0
          retention-days: 5

      - name: Download the installed disk of an earlier run
        if: env.REUSE_RUN != ''
        run: |
          set -euxo pipefail
          gh run download "$REUSE_RUN" -R bindreams/devvm -n "base-$LEG" -D "$WORK/base"
          ls -l "$WORK/base"

      # The stage ================================================================================================

      # procdump goes to the stage disks of the SSH-driven stages (hangdump.ps1 uses it in the guest). Sysinternals
      # replaces the zip in place, so the hash is recorded, not pinned.
      - name: Fetch procdump
        if: env.STAGE != ''
        run: |
          set -euxo pipefail
          mkdir -p "$WORK/tools" "$RUNNER_TEMP/procdump"
          curl -X GET -fsSL -o "$RUNNER_TEMP/procdump/Procdump.zip" https://download.sysinternals.com/files/Procdump.zip
          sha256sum "$RUNNER_TEMP/procdump/Procdump.zip" | tee "$OUT/procdump-sha256.txt"
          unzip -q -o "$RUNNER_TEMP/procdump/Procdump.zip" procdump64.exe -d "$WORK/tools"
          ls -l "$WORK/tools"

      # STAGE is a comma-separated list of `<stage>` or `<stage>:<variant>`; each boots a fresh overlay of the base with
      # its own stage disk (lib.ps1, hook.ps1, the stage's files, variant.txt) and ends at the stage's DONE marker.
      - name: Boot the installed disk with a stage disk
        if: env.STAGE != ''
        timeout-minutes: 150
        run: |
          set -euxo pipefail
          qemu_img=$(find "$WORK/qemu" -name qemu-img.exe | head -n 1)
          for entry in ${STAGE//,/ }; do
              stage=${entry%%:*}
              variant=${entry#*:}
              [[ "$variant" == "$entry" ]] && variant=
              tag=${entry//:/-}
              dir=spike/guest/stages/$stage
              mkdir -p "$WORK/stage-$tag"
              echo "$variant" > "$WORK/stage-$tag/variant.txt"
              files=(spike/guest/lib.ps1 spike/guest/hook.ps1 spike/guest/ssh-common.ps1 spike/guest/m5helper.cs "$WORK/stage-$tag/variant.txt")
              for f in "$dir"/*; do
                  case "$(basename "$f")" in
                      DONE | DRIVER | BOUND | EXPECT_FAILED) ;;
                      *) files+=("$f") ;;
                  esac
              done
              # A stage with a DRIVER file is driven over SSH from here by the script the file names (spike/<script>): keys,
              # the broker, the shared guest files and the larger disk come with it, and the run ends when the driver does
              # (run_qemu.py `--driver`: its exit code can ask for a relaunch).
              driver=()
              if [[ -f "$dir/DRIVER" ]]; then
                  openssh=/c/Windows/System32/OpenSSH
                  keys="$WORK/keys-$tag"
                  mkdir -p "$keys"
                  "$openssh/ssh-keygen.exe" -q -t ed25519 -N '' -f "$(cygpath -w "$keys/client")"
                  "$openssh/ssh-keygen.exe" -q -t ed25519 -N '' -f "$(cygpath -w "$keys/host")"
                  "$openssh/ssh-keygen.exe" -q -t ed25519 -N '' -f "$(cygpath -w "$keys/other")"
                  echo "[127.0.0.1]:2222 $(cut -d' ' -f1,2 "$keys/host.pub")" > "$keys/known_hosts"
                  echo "[127.0.0.1]:2222 $(cut -d' ' -f1,2 "$keys/other.pub")" > "$keys/known_hosts_other"
                  cp "$keys/host" "$keys/ssh_host_ed25519_key"
                  cp "$keys/host.pub" "$keys/ssh_host_ed25519_key.pub"
                  cp "$keys/client.pub" "$keys/authorized_keys"
                  files+=("$keys/ssh_host_ed25519_key" "$keys/ssh_host_ed25519_key.pub" "$keys/authorized_keys" "$WORK/broker/ssh-broker.exe")
                  files+=(spike/guest/probe.ps1 spike/guest/config.yaml spike/guest/watch.ps1 spike/guest/killagent.ps1)
                  files+=(spike/guest/eb-runner.ps1 spike/guest/eb-runner2.ps1)
                  files+=(spike/guest/hangdump.ps1 "$WORK/tools/procdump64.exe")
                  # The driver's receiver writes the guest's dumps here (wedge_driver.py `dump`).
                  mkdir -p "$WORK/hang/$tag"
                  export DEVVM_HANG_DIR="$WORK/hang/$tag"
                  script=$(cat "$dir/DRIVER")
                  driver=(--ssh-port 2222 --driver uv run --script "spike/$script" "$(cygpath -w "$OUT/stage-$tag-driver")" "$(cygpath -w "$keys")" 2222)
              fi
              "$WORK/tool/seed_spike.exe" "$WORK/stage-$tag.img" "${files[@]}" | tee "$OUT/stage-disk-$tag.txt"
              "$qemu_img" create -f qcow2 -b "$WORK/base/base.qcow2" -F qcow2 "$WORK/stage-$tag.qcow2"
              cp "$WORK/base/vars.fd" "$WORK/stage-$tag-vars.fd"
              if [[ -f "$dir/DRIVER" ]]; then
                  "$qemu_img" resize "$WORK/stage-$tag.qcow2" 80G
              fi
              # An hour is the failure bound for one stage unless its BOUND file (seconds) says less; a stage that does not end
              # is recorded and the next one still runs. A stage with an EXPECT_FAILED file passes when its guest sends
              # DEVVM-BASE-FAILED= and ends itself (M2); it has no done marker.
              bound=3600
              if [[ -f "$dir/BOUND" ]]; then
                  bound=$(cat "$dir/BOUND")
              fi
              ending=(--done "$(cat "$dir/DONE")")
              if [[ -f "$dir/EXPECT_FAILED" ]]; then
                  ending=(--expect-failed)
              fi
              if ! timeout "$bound" uv run --script spike/run_qemu.py stage \
                --qemu-dir "$WORK/qemu" --out "$OUT/stage-$tag" --disk "$WORK/stage-$tag.qcow2" --vars "$WORK/stage-$tag-vars.fd" \
                --usb-disk "$WORK/stage-$tag.img" "${ending[@]}" --cpu "$CPU" "${driver[@]}"; then
                  echo "stage $tag did not end cleanly" | tee -a "$OUT/stage-failures.txt"
                  taskkill //F //IM qemu-system-x86_64.exe || true
              fi
              rm -f "$WORK/stage-$tag.qcow2" "$WORK/stage-$tag-vars.fd"
          done
          if [[ -s "$OUT/stage-failures.txt" ]]; then
              exit 1
          fi

      - name: Stop QEMU
        if: always()
        run: taskkill //F //IM qemu-system-x86_64.exe || true

      # E1 of the wedge root-cause run: the call stacks of the guest's hang dumps (spike/stacks.sh). A failure here
      # leaves the dumps, which the next step uploads, for a rerun through `stacks_from` in spike/PLAN.
      - name: Stacks of the hang dumps
        if: always()
        continue-on-error: true
        timeout-minutes: 40
        run: bash spike/stacks.sh "$WORK/hang" "$OUT/stacks" "$WORK/stacks-scratch" 2>&1 | tee "$OUT/stacks.log"

      - name: Upload the hang dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangdumps-${{ matrix.leg }}
          path: ${{ env.WORK }}/hang
          if-no-files-found: ignore
          retention-days: 5

      # winpe.cmd logs onto the writable answer disk; 7-Zip reads the FAT image.
      - name: Collect the answer disk's files
        if: always()
        run: |
          set -x
          if [[ -f "$WORK/answer.img" ]]; then
              cp "$WORK/answer.img" "$OUT/answer-after.img"
              "/c/Program Files/7-Zip/7z.exe" x -y "-o$OUT/answer-disk-files" "$WORK/answer.img" || true
          fi

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.leg }}
          path: ${{ env.OUT }}

  # `stacks_from=<run id>` in spike/PLAN: read the hang dumps of that run again (a new cdb command file, a symbol
  # problem) without booting a guest.
  stacks:
    needs: [plan]
    if: needs.plan.outputs.stacks_from != ''
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    defaults:
      run:
        shell: bash
    env:
      OUT: D:/spike/out
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the hang dumps of the earlier run
        run: |
          set -euxo pipefail
          mkdir -p "$WORK/hang" "$OUT"
          gh run download "${{ needs.plan.outputs.stacks_from }}" -R bindreams/devvm -n "hangdumps-${{ matrix.leg }}" -D "$WORK/hang"
          find "$WORK/hang" -name '*.dmp' -exec ls -l {} +

      - name: Stacks of the hang dumps
        run: bash spike/stacks.sh "$WORK/hang" "$OUT/stacks" "$WORK/stacks-scratch" 2>&1 | tee "$OUT/stacks.log"

      - name: Upload the stacks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stacks-${{ matrix.leg }}
          path: ${{ env.OUT }}

  m12b:
    needs: [plan, seedtool]
    if: needs.plan.outputs.m12b != ''
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      OUT: D:/spike/out
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: false

      - name: Download and verify QEMU
        run: |
          set -euxo pipefail
          mkdir -p "$WORK" "$OUT"
          url=$(sed -n 's/^url = "\(.*\)"/\1/p' crates/devvm/qemu-manifest.toml)
          want=$(sed -n 's/^sha256 = "\(.*\)"/\1/p' crates/devvm/qemu-manifest.toml)
          asset=${url##*/}
          tag=$(basename "$(dirname "$url")")
          gh release download "$tag" -R bindreams/devvm -p "$asset" -D "$RUNNER_TEMP/qemu-dl"
          got=$(sha256sum "$RUNNER_TEMP/qemu-dl/$asset" | cut -d' ' -f1)
          got=${got#'\'}
          test "$want" = "$got"
          mkdir -p "$WORK/qemu"
          unzip -q "$RUNNER_TEMP/qemu-dl/$asset" -d "$WORK/qemu"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seedtool
          path: ${{ env.WORK }}/tool

      - name: Download the en-US evaluation ISO
        timeout-minutes: 45
        run: |
          set -euxo pipefail
          mkdir -p "$WORK/iso"
          curl -X GET -fsSL -o "$WORK/iso/win.iso" -w 'final url: %{url_effective}\nbytes: %{size_download}\n' "$ISO_URL_EN_US" | tee "$OUT/iso-download.txt"

      - name: M12b, the overlay
        timeout-minutes: 60
        run: bash spike/m12b.sh "$WORK/qemu" "$WORK/iso/win.iso" "$WORK/tool/seed_spike.exe" "$OUT" 2>&1 | tee "$OUT/m12b.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-m12b
          path: ${{ env.OUT }}
