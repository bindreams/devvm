[package]
name = "devvm-cli"
description = "Command-line interface of devvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "devvm_cli"
harness = false

[[bin]]
name = "devvm"
path = "src/main.rs"

[dependencies]
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
devvm = { path = "../devvm" }

[dev-dependencies]
cosca = { version = "0.6.0", features = ["serde"] }
serde_json = "1.0.154"
skuld = { workspace = true }

# The longest AF_UNIX path of a Unix host, for `tests/vm_cli.rs`.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "commands"
path = "tests/commands.rs"
harness = false

[[test]]
name = "exit"
path = "tests/exit.rs"
harness = false

[[test]]
name = "ls"
path = "tests/ls.rs"
harness = false

[[test]]
name = "vm_cli"
path = "tests/vm_cli.rs"
harness = false
