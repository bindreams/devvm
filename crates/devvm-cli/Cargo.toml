[package]
name = "devvm-cli"
description = "Command-line interface of devvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "devvm_cli"
harness = false

[[bin]]
name = "devvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
devvm = { path = "../devvm" }

[dev-dependencies]
serde_json = "1.0.154"
skuld = { workspace = true }

[[test]]
name = "exit"
path = "tests/exit.rs"
harness = false
