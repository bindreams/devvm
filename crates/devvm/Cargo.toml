[package]
name = "devvm"
description = "Disposable virtual machines for tests: recipes, a layer cache, and QEMU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
harness = false

[dependencies]
hex = "0.4"
home = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
yaml_serde = "0.10"
bytesize = "2.7.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
# Directory modification times (`access/sftp/local.rs`): `std` cannot open a directory for writing on Unix.
filetime = "0.2"
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
url = "2.5.8"
percent-encoding = "2.3.2"
cosca = { version = "0.6.0", features = ["serde"] }
# QMP command and event types; devvm drives the socket itself (`backend/qemu/qmp.rs`).
qapi = { version = "0.15", default-features = false, features = ["qmp"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = "1.1"
# The embedded SSH client behind a blocking API (`access/`): one private runtime, no `ssh.exe`.
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
os_str_bytes = "7"
# Private keys: kept out of `Debug` output and zeroed on drop (`access/keys.rs`).
secrecy = "0.10"
tar = "0.4.46"
# Pinned: `media.rs` and its tests rely on this version's behaviour; a human re-checks it before a bump (Renovate
# does not automerge it).
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }

# A Windows ISO's UDF tree, its El Torito catalog and its image list (`iso/`). The hadris crates are release candidates of
# one version (about 12 small crates in all): a breaking rc is possible, so the pin is exact and a human re-checks it
# before a bump (Renovate does not automerge it).
hadris-udf = "=3.0.0-rc.3"
hadris-fs = { version = "=3.0.0-rc.3", features = ["std", "sync"] }
hadris-storage = { version = "=3.0.0-rc.3", features = ["std"] }
hadris-iso = "=3.0.0-rc.3"
# The one XML crate: the image list of `install.wim` (`iso/wim.rs`) and the escaping of `Autounattend.xml`.
quick-xml = "0.42"

[dev-dependencies]
skuld = { workspace = true }
# Virtual time for the boot-gate test (`access/session_tests.rs`).
tokio = { version = "1", features = ["test-util", "process"] }
# The executors a library caller may be inside (`test_support/callers.rs`).
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

# Windows directories, the ANSI code page and the hypervisor come from the OS (`host/windows.rs`); QMP is AF_UNIX
# (`backend/qemu/uds.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Hypervisor",
    "Win32_UI_Shell",
] }
uds_windows = "1.2"

# The longest AF_UNIX path of a Unix host (`host/unix.rs`), and an atomic rename that does not replace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

# The fake VM reports its own job and console to the tests (`test_support/fake_vm`).
[target.'cfg(windows)'.dev-dependencies]
# Makes the NTFS junctions that `host/windows_tests.rs` and `copy_windows_tests.rs` check against.
junction = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
