# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# `.tmp/` is agent scratch, not source to be linted or reformatted, same rationale as `target/`. Both are gitignored;
# excluding them too guards against a stray force-add.
exclude = "^(target|\\.tmp)/"
default_install_hook_types = ["pre-commit", "commit-msg"]

# Local hooks ==========================================================================================================

[[repos]]
repo = "local"

[[repos.hooks]]
id = "no-std-test"
name = "no stray #[test] attribute"
# Every target in this workspace has `harness = false` and registers tests with `#[skuld::test]`. A bare `#[test]` is
# invisible to skuld's runner and would silently not run, in `_tests.rs` and `tests/` files as much as anywhere.
entry = '^\s*#\[test\]'
language = "pygrep"
types = ["rust"]

[[repos.hooks]]
id = "no-cargo-in-tests"
name = "no runtime cargo invocations in test code"
# Test code must locate prebuilt fixture binaries (CARGO_BIN_EXE_*), never build them: a concurrent `cargo build`'s
# uplift deletes and recreates `target/<profile>/<bin>`, racing sibling tests' spawns.
entry = 'Command::new\("cargo"\)'
language = "pygrep"
types = ["rust"]
files = '(^|/)tests/|_tests\.rs$'

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets --locked -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "format-section-comments"
name = "format section comments"
entry = "python scripts/format-section-comments.py"
language = "python"
types_or = ["rust", "python", "toml", "javascript", "ts", "jsx", "tsx", "dockerfile"]

# External hooks =======================================================================================================
# Every external hook is pinned as `rev = "<40-hex commit SHA>" # frozen: <tag>`, with `repo` on the line before
# `rev`. `prek autoupdate --freeze` writes this form, and Renovate's custom manager tracks only this form.

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
hooks = [
  { id = "check-executables-have-shebangs" },
  # Rust inner attributes start with `#![...]`, which the shebang detector mistakes for `#!/...`. Exclude .rs.
  { id = "check-shebang-scripts-are-executable", exclude_types = ["rust"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "e8b4e28241a9ae8296ba6e4a491b5da4eda73283" # frozen: 3.11.1
hooks = [
  # Rust gets `cargo fmt`; markdown gets prettier; both have stronger opinions than .editorconfig and conflict on
  # trailing whitespace, so exclude them.
  { id = "editorconfig-checker", exclude_types = ["rust", "markdown"] },
]

[[repos]]
# Prettier (rather than mdformat) so trailing-two-space line breaks are preserved.
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
hooks = [
  { id = "prettier", types = ["markdown"] },
]
