# Throwaway measurement for devvm#40 (process exit ordering, DeleteFileW semantics). Not part of the workspace.
[package]
name = "exit-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
