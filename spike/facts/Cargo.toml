# Throwaway measurement of OS facts for the "failed check is not gone" class (see the workflow). Not part of the workspace.
[package]
name = "facts-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
